<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>CELPIP 12 — Speaking & Listening Prep</title>
  <meta name="description" content="Minimalist CELPIP prep app focused on Speaking, Listening, Grammar, and Natural Speaking. Target: 12." />
  <meta name="theme-color" content="#0b0b0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CELPIP 12" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" href="./icons/icon-192.png" />
  <style>
:root{
  --bg:#0b0b0f; --bg2:#121218; --card:#16161e; --card2:#1c1c26;
  --line:#262633; --txt:#f4f4f6; --mut:#9a9aab; --accent:#6c7bff;
  --accent2:#8b97ff; --good:#34d399; --bad:#f87171; --warn:#fbbf24;
  --r:16px; --tab-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
#app{
  max-width:560px; margin:0 auto;
  padding:0 16px calc(var(--tab-h) + env(safe-area-inset-bottom,0) + 24px);
  padding-top:env(safe-area-inset-top,0);
}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* header */
.hd{display:flex;align-items:center;gap:12px;padding:18px 0 12px;position:sticky;top:0;background:linear-gradient(var(--bg) 70%,transparent);z-index:5}
.hd h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}
.hd-txt p{color:var(--mut);font-size:.85rem;margin-top:2px}
.logo{font-size:1.6rem;color:var(--accent)}
.back{background:var(--card);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:50%;font-size:1.5rem;line-height:1;cursor:pointer;flex:none}
.gear{margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--mut);width:38px;height:38px;border-radius:50%;font-size:1.1rem;line-height:1;cursor:pointer;flex:none}
.gear:active{color:var(--txt);border-color:var(--accent)}

/* settings */
.select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:13px;font-size:.95rem;margin-bottom:14px;-webkit-appearance:none;appearance:none}
.slabel{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;margin:6px 0}
.slabel b{color:var(--accent2)}
.range{width:100%;margin:4px 0 16px;accent-color:var(--accent)}

/* writing box */
.writebox{width:100%;min-height:180px;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:13px;font-size:1rem;line-height:1.5;font-family:inherit;resize:vertical}
.wcount{font-size:.82rem;color:var(--mut);margin:8px 0 14px;text-align:right}
.wcount.ok{color:var(--good)}
.wcount.ok #wc,.wcount #wc{font-weight:700}
.checks{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent);flex:none;width:18px;height:18px}

/* reading passage */
.passage{background:var(--card2);border-radius:11px;padding:14px;font-size:.92rem;line-height:1.6;margin:6px 0 12px;color:var(--txt)}

/* mock progress */
.mock-prog{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.mp{flex:1;min-width:60px;text-align:center;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 4px}
.mp.done{color:var(--good);border-color:var(--good)}
.mp.cur{color:#fff;background:var(--accent);border-color:var(--accent)}

/* hero */
.hero{background:linear-gradient(135deg,#1a1b2e,#141420);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;align-items:center;gap:20px;margin-bottom:18px}
.hero.compact{padding:16px}
.hero-target{display:flex;flex-direction:column;align-items:center;padding-right:18px;border-right:1px solid var(--line)}
.t-num{font-size:3rem;font-weight:800;line-height:1;background:linear-gradient(180deg,#fff,var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.t-lab{font-size:.7rem;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.hero-stats{display:flex;gap:18px;flex:1;justify-content:space-around}
.hero-stats.wide{justify-content:space-between;width:100%}
.hero-stats div{display:flex;flex-direction:column;align-items:center}
.hero-stats b{font-size:1.5rem;font-weight:700}
.hero-stats span{font-size:.72rem;color:var(--mut)}

/* section titles */
section{margin-bottom:18px}
h2{font-size:1.05rem;font-weight:600;margin-bottom:10px}
h3{font-size:1rem;font-weight:600;margin-bottom:8px}
em{font-style:normal;color:var(--accent2);font-size:.78em;font-weight:600}

/* plan */
.plan-list{display:flex;flex-direction:column;gap:8px}
.plan-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--txt);font-size:.92rem;cursor:pointer;text-align:left}
.pi-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--mut);flex:none}
.pi-dot.on{background:var(--good);border-color:var(--good)}
.pi-txt{flex:1}
.pi-go,.row-go,.mc-go{color:var(--mut);font-size:1.3rem}

/* module cards */
.modules{display:flex;flex-direction:column;gap:10px}
.mcard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;color:var(--txt);text-align:left;transition:transform .1s,border-color .2s}
.mcard:active{transform:scale(.98);border-color:var(--accent)}
.mc-ic{font-size:1.5rem;width:44px;height:44px;display:grid;place-items:center;background:var(--card2);border-radius:12px;flex:none}
.mc-body{flex:1;display:flex;flex-direction:column;gap:2px}
.mc-title{font-weight:600}
.mc-desc{font-size:.8rem;color:var(--mut)}

/* rows / lists */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;color:var(--txt);text-align:left;transition:border-color .2s}
.row:active{border-color:var(--accent)}
.row-n{width:32px;height:32px;border-radius:9px;background:var(--card2);display:grid;place-items:center;font-weight:700;color:var(--accent2);flex:none}
.row-ic{font-size:1.3rem;width:32px;text-align:center;flex:none}
.row-body{flex:1;display:flex;flex-direction:column}
.row-body small{color:var(--mut);font-size:.78rem}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card.center{text-align:center}
.pill{display:inline-block;background:var(--accent);color:#fff;font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.prompt{font-size:1.15rem;line-height:1.45;font-weight:500}
.note{color:var(--mut);font-size:.85rem;margin-bottom:10px}

/* buttons */
.primary{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px 20px;font-size:1rem;font-weight:600;cursor:pointer;width:100%;transition:transform .1s,opacity .2s}
.primary:active{transform:scale(.98)}
.primary:disabled{opacity:.5}
.primary.big{font-size:1.1rem;padding:16px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px 18px;font-size:.92rem;cursor:pointer;width:100%}
.ghost.sm{width:auto;padding:7px 14px;font-size:.82rem;margin-top:10px}
.rec{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:14px 20px;font-weight:600;cursor:pointer;flex:1}
.rec.live{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}

/* speaking timer */
.timer-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;text-align:center;margin-bottom:14px}
.timer{font-size:3.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;display:inline-flex;flex-direction:column;align-items:center}
.timer small{font-size:.7rem;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:.1em;margin-top:4px}
.timer.warn{color:var(--warn)}
.timer.ready{color:var(--good)}
.rec-row{display:flex;gap:10px;margin:16px 0 8px}
.phase{font-size:.85rem;color:var(--mut);min-height:1.2em}
#player{width:100%;margin-top:12px;border-radius:10px}

/* framework / chips */
.frame{padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.frame li{padding-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:20px;padding:8px 12px;font-size:.82rem;cursor:pointer}
.chip:active{border-color:var(--accent)}
.chip.mini{padding:4px 8px}

/* rubric */
.rub-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rub-row:last-of-type{border-bottom:none}
.rub-lab{flex:1}
.rub-lab small{display:block;color:var(--mut);font-size:.72rem}
.rub-stars{display:flex;gap:2px}
.rub-stars button{background:none;border:none;color:var(--line);font-size:1.4rem;cursor:pointer;padding:0 1px}
.rub-stars button.on{color:var(--warn)}

/* questions */
.qh{margin:6px 0 12px}
.qtext{font-weight:600;margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:13px 14px;font-size:.92rem;cursor:pointer;transition:border-color .15s}
.opt:active{border-color:var(--accent)}
.opt.right{background:rgba(52,211,153,.15);border-color:var(--good);color:#d1fae5}
.opt.wrong{background:rgba(248,113,113,.13);border-color:var(--bad);color:#fecaca}
.why,.why2{margin-top:10px;font-size:.85rem;color:var(--accent2);background:var(--card2);border-radius:10px;padding:10px 12px;line-height:1.45}

/* transcript */
.transcript summary{cursor:pointer;font-weight:600;color:var(--accent2);list-style:none}
.transcript summary::-webkit-details-marker{display:none}
.tr{margin-top:12px;display:flex;flex-direction:column;gap:8px;font-size:.88rem;color:var(--mut)}
.tr b{color:var(--txt)}

/* natural */
.drill .stiff{font-size:1.05rem;color:var(--mut);font-style:italic;margin:6px 0 14px}
.natural{font-size:1.15rem;font-weight:600;margin-bottom:8px;color:var(--good)}
.nlist{display:flex;flex-direction:column;gap:10px}
.nitem{background:var(--card2);border-radius:11px;padding:11px 13px}
.ni-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nitem small{display:block;color:var(--mut);font-size:.8rem;margin-top:3px}

/* progress */
.heat{display:flex;gap:5px;flex-wrap:wrap}
.cell{width:18px;height:18px;border-radius:5px;background:var(--card2)}
.cell.lvl1{background:#2a3170}.cell.lvl2{background:#4453c2}.cell.lvl3{background:#6c7bff}.cell.lvl4{background:#9aa6ff}
.hist-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.hist-row:last-child{border-bottom:none}
.hist-row span{flex:1}
.hist-row small{color:var(--mut);font-size:.74rem}

.tip{color:var(--mut);font-size:.8rem;text-align:center;margin-top:8px;line-height:1.5}

/* tab bar */
.tabs{position:fixed;bottom:0;left:0;right:0;height:calc(var(--tab-h) + env(safe-area-inset-bottom,0));padding-bottom:env(safe-area-inset-bottom,0);background:rgba(14,14,20,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;z-index:20}
.tabs button{flex:1;background:none;border:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size:0}
.tabs button span{font-size:1.25rem;filter:grayscale(1) opacity(.6)}
.tabs button small{font-size:.66rem}
.tabs button.on{color:var(--accent2)}
.tabs button.on span{filter:none}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0) + 16px);transform:translateX(-50%) translateY(20px);background:var(--accent);color:#fff;padding:12px 20px;border-radius:30px;font-size:.9rem;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:50;box-shadow:0 8px 30px rgba(108,123,255,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  </style>
</head>
<body>
  <main id="app"></main>
  <script>
/* ---- inlined data ---- */
// CELPIP Speaking — 8 official task types, tuned for a CLB 12 target.
// Each task has prep/response timing matching the real test, multiple prompts,
// a model-answer framework, high-band "power phrases", and a self-assessment rubric.

const SPEAKING_TASKS = [
  {
    id: 1,
    title: "Giving Advice",
    prep: 30,
    response: 90,
    blurb: "Advise a person about a situation. Be clear, structured, and supportive.",
    prompts: [
      "Your friend has been offered a job in another city but is unsure about moving. Give them advice.",
      "A coworker keeps missing deadlines and is stressed. Advise them on how to manage their workload.",
      "Your cousin wants to buy their first car but has a limited budget. Give them advice.",
      "A friend wants to learn English faster for an exam. Advise them on the best approach."
    ],
    framework: [
      "Acknowledge the situation (1 sentence): 'I can see why you'd feel torn about this.'",
      "Give 2–3 concrete recommendations, each with a reason.",
      "Add a 'what I would do' personal angle to sound natural.",
      "Close with encouragement: 'Whatever you decide, I'm sure it'll work out.'"
    ],
    power: [
      "If I were in your shoes, I'd…",
      "The way I see it, you've got two solid options.",
      "What's worked for me in the past is…",
      "It might be worth weighing up the pros and cons.",
      "At the end of the day, it's your call, but…"
    ]
  },
  {
    id: 2,
    title: "Talking about a Personal Experience",
    prep: 30,
    response: 60,
    blurb: "Tell a short story from your own life. Use vivid past-tense narration.",
    prompts: [
      "Describe a time you helped a stranger.",
      "Talk about a memorable trip you took.",
      "Describe a time you overcame a difficult challenge.",
      "Talk about an accomplishment you're proud of."
    ],
    framework: [
      "Set the scene: when, where, who (1 sentence).",
      "Build the story with sequencing words (first, then, suddenly).",
      "Add one emotional beat: how you felt in the moment.",
      "End with the outcome and what it meant to you."
    ],
    power: [
      "This happened a couple of years back, when…",
      "Out of nowhere, …",
      "To be honest, I was a little nervous at first.",
      "Looking back on it, …",
      "It's a memory that's really stuck with me."
    ]
  },
  {
    id: 3,
    title: "Describing a Scene",
    prep: 30,
    response: 60,
    blurb: "Describe a picture in detail. Cover people, place, actions, and atmosphere.",
    prompts: [
      "Describe a busy farmers' market on a sunny morning.",
      "Describe a family having a picnic in a park.",
      "Describe a crowded train station at rush hour.",
      "Describe a group of friends celebrating at a restaurant."
    ],
    framework: [
      "Overview first: 'This looks like a…'",
      "Foreground → background, or left → right, systematically.",
      "Use present continuous: 'A man is…', 'Some children are…'",
      "Add inferred details: weather, mood, what just/likely happened."
    ],
    power: [
      "In the foreground, …",
      "Off to the left/right, you can see…",
      "It looks as though…",
      "Judging by their expressions, they seem…",
      "In the background, there's…"
    ]
  },
  {
    id: 4,
    title: "Making Predictions",
    prep: 30,
    response: 60,
    blurb: "Predict what will happen next in a scene. Use future forms with reasons.",
    prompts: [
      "Predict what will happen next: dark clouds gather over an outdoor wedding.",
      "Predict what will happen next: a child reaches for a glass near the table edge.",
      "Predict what will happen next: two cyclists approach a sharp, wet corner.",
      "Predict what will happen next: a chef carries a tall stack of plates."
    ],
    framework: [
      "Describe the setup briefly (1 sentence).",
      "Make 2–3 predictions, each with a 'because' justification.",
      "Vary your future forms: will / going to / likely to / about to.",
      "End with the most probable outcome."
    ],
    power: [
      "It looks like they're about to…",
      "Chances are, …",
      "I'd say it's very likely that…",
      "If that happens, then…",
      "In all probability, …"
    ]
  },
  {
    id: 5,
    title: "Comparing and Persuading",
    prep: 60,
    response: 60,
    blurb: "Choose between two options for someone and persuade them of your choice.",
    prompts: [
      "Persuade a relative to choose either a beach holiday or a city holiday.",
      "Recommend either a laptop or a tablet for a student and persuade them.",
      "Persuade a friend to choose either a gym membership or home workouts.",
      "Recommend either a house in the suburbs or an apartment downtown."
    ],
    framework: [
      "State your recommendation clearly and confidently up front.",
      "Give 2 strong reasons tailored to the person's needs.",
      "Briefly acknowledge the other option, then dismiss it politely.",
      "Close with a confident call to action."
    ],
    power: [
      "Honestly, I'd go with… and here's why.",
      "Given what you're after, this is the better fit.",
      "Sure, the other one has its perks, but…",
      "Trust me on this one — you won't regret it.",
      "All things considered, this is the smarter choice."
    ]
  },
  {
    id: 6,
    title: "Dealing with a Difficult Situation",
    prep: 60,
    response: 60,
    blurb: "Navigate an awkward situation. Pick an approach and explain it tactfully.",
    prompts: [
      "Your friend lent you a jacket and you damaged it. Explain the situation to them.",
      "You double-booked plans with two friends on the same night. Resolve it.",
      "A neighbour's loud parties keep you awake. Address it with them.",
      "You received the wrong order at a restaurant. Speak to the server."
    ],
    framework: [
      "Choose ONE clear approach and commit to it.",
      "Open diplomatically — soften before the issue.",
      "State the problem and your proposed solution.",
      "End on a cooperative, face-saving note."
    ],
    power: [
      "I hope you don't mind me bringing this up, but…",
      "I feel terrible about this — let me make it right.",
      "Would it be possible to…?",
      "I completely understand, and here's what I can do.",
      "Let's find a way that works for both of us."
    ]
  },
  {
    id: 7,
    title: "Expressing Opinions",
    prep: 30,
    response: 90,
    blurb: "Give and defend your opinion on a statement. Take a firm, reasoned stance.",
    prompts: [
      "Some people think social media does more harm than good. Do you agree?",
      "Should public transit be free for everyone? Give your opinion.",
      "Is it better to work for a big company or a small one? Why?",
      "Should students be required to learn a second language? Why or why not?"
    ],
    framework: [
      "State your position unambiguously in the first sentence.",
      "Give 2 reasons, each developed with an example.",
      "Address a counterpoint, then rebut it.",
      "Restate your position with a memorable closing line."
    ],
    power: [
      "I firmly believe that…",
      "There are a couple of reasons I feel this way.",
      "Take, for example, …",
      "Now, some might argue…, but I'd counter that…",
      "So all in all, I'm convinced that…"
    ]
  },
  {
    id: 8,
    title: "Describing an Unusual Situation",
    prep: 30,
    response: 60,
    blurb: "Describe something strange in a picture to someone who can't see it.",
    prompts: [
      "Describe an unusual object you saw: a chair shaped like a giant hand.",
      "Describe a strange sight: a dog wearing a full business suit.",
      "Describe an odd scene: a car completely covered in grass.",
      "Describe something unusual: a tree growing inside a living room."
    ],
    framework: [
      "Name the unusual thing and your reaction (1 sentence).",
      "Describe it precisely — size, colour, shape, position.",
      "Compare it to something familiar to aid understanding.",
      "Speculate about why it might be there."
    ],
    power: [
      "You won't believe what I'm looking at.",
      "It's roughly the size of…",
      "It kind of reminds me of…",
      "The strangest part is…",
      "I can only assume that…"
    ]
  }
];

const SPEAKING_RUBRIC = [
  { key: "content", label: "Content & coverage", hint: "Did you fully address the task and develop your ideas?" },
  { key: "vocab", label: "Vocabulary range", hint: "Precise, varied, idiomatic word choice (CLB 11–12)." },
  { key: "grammar", label: "Grammar accuracy", hint: "Complex structures used accurately and flexibly." },
  { key: "fluency", label: "Fluency & flow", hint: "Smooth pace, minimal hesitation, natural rhythm." },
  { key: "pron", label: "Pronunciation", hint: "Clear sounds, word stress, and sentence intonation." }
];


// CELPIP Listening practice. Passages are played via on-device Text-to-Speech
// (works on iOS Safari). Each item: a transcript (spoken), then comprehension
// questions with explanations. Covers the official listening part types.

const LISTENING_SETS = [
  {
    id: "ls1",
    part: "Part 1 — Problem Solving",
    title: "The Missing Delivery",
    voices: 2,
    lines: [
      { s: "Woman", t: "Hi, I'm calling about a package that was supposed to arrive on Tuesday. It's now Friday and I still haven't received it." },
      { s: "Man", t: "I'm sorry to hear that. Could you give me your tracking number so I can look into it?" },

/* ---------- speech (TTS) — uses the device's best on-device voice (no APIs) ---------- */
const TTS = {
  voices: [],
  init() {
    if (!("speechSynthesis" in window)) return;
    const load = () => {
      const vs = speechSynthesis.getVoices();
      if (vs && vs.length) this.voices = vs;
    };
    load();
    speechSynthesis.addEventListener("voiceschanged", load);
  },
  englishVoices() {
    const en = this.voices.filter(v => /^en([-_]|$)/i.test(v.lang));
    return (en.length ? en : this.voices).slice().sort((a, b) => this.quality(b) - this.quality(a));
  },
  // Rank voices so the most natural-sounding local voice wins.
  quality(v) {
    const n = (v.name + " " + (v.voiceURI || "")).toLowerCase();
    let s = 0;
    if (/siri/.test(n)) s += 70;                                  // iOS neural Siri voices
    if (/(enhanced|premium|neural|natural)/.test(n)) s += 55;     // downloadable HQ voices
    if (/(google|microsoft)/.test(n)) s += 30;                    // good on Android/desktop
    if (/(ava|samantha|allison|joelle|nicky|zoe|serena|evan|nathan|tom|aaron|noelle)/.test(n)) s += 12;
    if (/(compact|eloquence|fred|albert|bad news|whisper|organ|bells|trinoids|zarvox)/.test(n)) s -= 60; // novelty/low-quality
    if (/en[-_]ca/i.test(v.lang)) s += 14;                        // CELPIP = Canadian English
    if (/en[-_]us/i.test(v.lang)) s += 8;
    if (/en[-_]gb/i.test(v.lang)) s += 4;
    return s;
  },
  best() {
    const en = this.englishVoices();
    const saved = store.get("voiceURI", null);
    if (saved) { const f = en.find(v => v.voiceURI === saved); if (f) return f; }
    return en[0] || this.voices[0] || null;
  },
  // For dialogues, pick a contrasting but still high-quality voice per speaker.
  pick(who) {
    const base = this.best();
    if (who !== "Man" && who !== "Woman") return base;
    const en = this.englishVoices();
    const female = /(female|woman|ava|samantha|allison|victoria|karen|moira|tessa|zoe|serena|kate|joelle|nicky|noelle|zira)/i;
    const male = /(male|man|daniel|alex|aaron|arthur|tom|evan|nathan|oliver|reed|rishi|gordon)/i;
    const want = who === "Woman" ? female : male;
    const avoid = who === "Woman" ? male : female;
    return en.find(v => want.test(v.name)) || en.find(v => !avoid.test(v.name)) || base;
  },
  rate() { return store.get("rate", 0.95); },
  // Split into sentence chunks so intonation resets and we get natural micro-pauses.
  chunks(text) { return (text.match(/[^.!?]+[.!?]*/g) || [text]).map(s => s.trim()).filter(Boolean); },
  async speak(text, who, opts = {}) {
    if (!("speechSynthesis" in window)) return;
    const voice = this.pick(who);
    const rate = opts.rate || this.rate();
    const pitch = opts.pitch != null ? opts.pitch : (who === "Man" ? 0.92 : 1.06);
    const parts = opts.noChunk ? [text] : this.chunks(text);
    for (let i = 0; i < parts.length; i++) {
      await new Promise((resolve) => {
        const u = new SpeechSynthesisUtterance(parts[i]);
        if (voice) u.voice = voice;
        u.lang = (voice && voice.lang) || "en-US";
        u.rate = rate; u.pitch = pitch;
        u.onend = resolve; u.onerror = resolve;
        speechSynthesis.speak(u);
      });
      if (i < parts.length - 1) await new Promise(r => setTimeout(r, 110)); // natural pause
    }
  },
  stop() { if ("speechSynthesis" in window) speechSynthesis.cancel(); },
};

function setupSpeakingFlow(task, root) {
  const timerEl = $("#timer", root), phaseEl = $("#phase", root);
  const startBtn = $("#startBtn", root), recBtn = $("#recBtn", root);
  const player = $("#player", root), rubric = $("#rubric", root);
  let interval, mediaRecorder, chunks = [], stream;

  function countdown(seconds, label, onDone) {
    clearInterval(interval);
    let t = seconds;
    timerEl.innerHTML = `${t}<small>${label}</small>`;
    interval = setInterval(() => {
      t--;
      timerEl.innerHTML = `${Math.max(t,0)}<small>${label}</small>`;
      timerEl.classList.toggle("warn", t <= 5);
      if (t <= 0) { clearInterval(interval); onDone(); }
    }, 1000);
  }

  startBtn.addEventListener("click", () => {
    startBtn.disabled = true;
    phaseEl.textContent = "Prep time — plan your structure.";
    countdown(task.prep, "prep", () => {
      phaseEl.textContent = "Go! Tap Record and speak now.";
      recBtn.disabled = false;
      timerEl.classList.add("ready");
      timerEl.innerHTML = `${task.response}<small>speak</small>`;
      navigator.vibrate && navigator.vibrate(120);
    });
  });

  recBtn.addEventListener("click", async () => {
    if (mediaRecorder && mediaRecorder.state === "recording") { stopRec(); return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      phaseEl.textContent = "⚠️ Microphone blocked. Allow mic access in Safari settings to record.";
      rubric.hidden = false; return;
    }
    chunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(chunks, { type: chunks[0]?.type || "audio/webm" });
      player.src = URL.createObjectURL(blob); player.hidden = false;
      stream.getTracks().forEach(t => t.stop());
      rubric.hidden = false;
      rubric.scrollIntoView({ behavior: "smooth", block: "start" });
    };
    mediaRecorder.start();
    recBtn.textContent = "■ Stop";
    recBtn.classList.add("live");
    phaseEl.textContent = "Recording… speak clearly and keep going.";
    countdown(task.response, "speak", () => stopRec());
  });

  function stopRec() {
    clearInterval(interval);
    if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
    recBtn.textContent = "● Record"; recBtn.classList.remove("live"); recBtn.disabled = true;
    phaseEl.textContent = "Nice. Play it back, then score yourself honestly below.";
  }
}

function renderListeningSet(arg) {
  const set = LISTENING_SETS.find(s => s.id === arg) || LISTENING_SETS[0];
  const v = el(`<div class="view">
    ${header(set.title, set.part, true)}
    <section class="card center">
      <button class="primary big" id="playBtn">▶ Play audio</button>
      <button class="ghost sm" id="stopBtn" hidden>■ Stop</button>

    </section>
    <section id="qzone" hidden></section>
    <details class="card transcript"><summary>Show transcript</summary>
      <div class="tr">${set.lines.map(l => `<p><b>${esc(l.s)}:</b> ${esc(l.t)}</p>`).join("")}</div>
    </details>
  </div>`);
  app.append(v);

  const playBtn = $("#playBtn", v), stopBtn = $("#stopBtn", v), lphase = $("#lphase", v);
  let played = 0;

  async function play() {
    playBtn.disabled = true; stopBtn.hidden = false;
    lphase.textContent = "▶ Playing…";
    for (const line of set.lines) {
      await TTS.speak(line.t, set.voices === 1 ? "Woman" : line.s);
      if (!document.body.contains(v)) return;
    }
    played++;
    stopBtn.hidden = true; playBtn.disabled = false;
    playBtn.textContent = played >= 2 ? "▶ Replay (used)" : "▶ Replay (1 left)";
    if (played >= 2) playBtn.disabled = true;
    lphase.textContent = "Now answer the questions below.";
    showQuestions();
  }
  playBtn.addEventListener("click", play);
  stopBtn.addEventListener("click", () => { TTS.stop(); stopBtn.hidden = true; playBtn.disabled = false; });

  function showQuestions() {
    const qzone = $("#qzone", v);
    if (!qzone.hidden) return;
    qzone.hidden = false;
    qzone.innerHTML = `<h2 class="qh">Questions</h2>` + set.questions.map((q, qi) => `
      <div class="card q" data-qi="${qi}">
        <p class="qtext">${qi + 1}. ${esc(q.q)}</p>
        <div class="opts">${q.options.map((o, oi) =>
          `<button class="opt" data-oi="${oi}">${esc(o)}</button>`).join("")}</div>
        <p class="why" hidden></p>
      </div>`).join("") + `<button class="primary" id="finishL" hidden>See result</button>`;

    let answered = 0; let correct = 0;
    qzone.querySelectorAll(".q").forEach(card => {
      const qi = +card.dataset.qi; const q = set.questions[qi];
      card.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", () => {
        if (card.classList.contains("done")) return;
        card.classList.add("done");
        const oi = +btn.dataset.oi;
        card.querySelectorAll(".opt").forEach((b, i) => {
          if (i === q.answer) b.classList.add("right");
          else if (i === oi) b.classList.add("wrong");
          b.disabled = true;
        });

/* ---------- shared quiz helper (used by mock listening & reading) ---------- */
function buildQuiz(container, questions, onComplete) {
  container.insertAdjacentHTML("beforeend", questions.map((q, qi) => `
    <div class="card q" data-qi="${qi}">
      <p class="qtext">${qi + 1}. ${esc(q.q)}</p>

      <p class="why" hidden></p>
    </div>`).join(""));
  let answered = 0, correct = 0;
  container.querySelectorAll(".q:not(.bound)").forEach(card => {
    card.classList.add("bound");
    const qi = +card.dataset.qi, q = questions[qi];
    card.querySelectorAll(".opt").forEach(btn => btn.addEventListener("click", () => {
      if (card.classList.contains("done")) return;
      card.classList.add("done");
      const oi = +btn.dataset.oi;
      card.querySelectorAll(".opt").forEach((b, i) => {
        if (i === q.answer) b.classList.add("right");
        else if (i === oi) b.classList.add("wrong");
        b.disabled = true;
      });
      const why = $(".why", card);
      if (q.why) { why.hidden = false; why.textContent = "💡 " + q.why; }
      if (oi === q.answer) correct++;
      if (++answered === questions.length) onComplete(correct);
    }));
  });
}

function renderMock(arg) {
  const mock = MOCK_EXAMS.find(m => m.id === arg) || MOCK_EXAMS[0];
  const results = {
    listening: { correct: 0, total: 0 },
    reading: { correct: 0, total: 0 },
    writing: { words: 0, done: false },
    speaking: { recorded: 0, total: 0 }
  };
  let si = 0;

  function progressBar() {
    return `<div class="mock-prog">${mock.sections.map((s, i) =>
      `<span class="mp ${i < si ? "done" : ""} ${i === si ? "cur" : ""}">${esc(s.title.split(" ")[0])}</span>`).join("")}</div>`;
  }
  function sectionHead(extra) {
    const sec = mock.sections[si];
    return `${header(mock.title, `Section ${si + 1} of ${mock.sections.length}`, true)}
      ${progressBar()}
      <section class="card center"><span class="pill">${esc(sec.title)}</span>
      ${sec.minutes ? `<p class="note">Suggested time: ${sec.minutes} minutes${extra || ""}</p>` : (extra ? `<p class="note">${extra.replace(/^ · /, "")}</p>` : "")}</section>`;
  }
  function run() {
    app.innerHTML = ""; TTS.stop(); window.scrollTo(0, 0);
    if (si >= mock.sections.length) return summary();
    const sec = mock.sections[si];
    const next = () => { si++; run(); };
    ({ listening: secListening, reading: secReading, writing: secWriting, speaking: secSpeaking }[sec.type])(sec, next);
  }

  function secListening(sec, next) {
    const sets = sec.setIds.map(id => LISTENING_SETS.find(s => s.id === id)).filter(Boolean);
    results.listening.total += sets.reduce((a, s) => a + s.questions.length, 0);
    const v = el(`<div class="view">${sectionHead(" · play each clip once")}
      <div id="msets"></div>
      <button class="primary" id="msNext" hidden>Continue →</button></div>`);
    app.append(v);
    const wrap = $("#msets", v); let done = 0, corr = 0;
    sets.forEach((set, idx) => {
      const block = el(`<section class="card">
        <span class="pill">Clip ${idx + 1} · ${esc(set.part)}</span>
        <button class="primary" data-p="${idx}">▶ Play clip ${idx + 1}</button>
        <div class="qhost" hidden></div></section>`);
      wrap.append(block);
      const btn = block.querySelector("[data-p]"), qhost = block.querySelector(".qhost");
      let played = false;
      btn.addEventListener("click", async () => {
        if (played) return; played = true; btn.disabled = true; btn.textContent = "▶ Playing…";
        for (const line of set.lines) { await TTS.speak(line.t, set.voices === 1 ? "Woman" : line.s); if (!document.body.contains(v)) return; }
        btn.textContent = "✓ Played"; qhost.hidden = false;
        buildQuiz(qhost, set.questions, c => { corr += c; if (++done === sets.length) { results.listening.correct += corr; $("#msNext", v).hidden = false; } });
      });
    });
    $("#msNext", v).addEventListener("click", next);
  }

  function secReading(sec, next) {
    const ps = sec.passageIds.map(id => READING_PASSAGES.find(p => p.id === id)).filter(Boolean);
    results.reading.total += ps.reduce((a, p) => a + p.questions.length, 0);
    const v = el(`<div class="view">${sectionHead(" · read, then answer")}
      <div id="mread"></div>
      <button class="primary" id="mrNext" hidden>Continue →</button></div>`);
    app.append(v);
    const wrap = $("#mread", v); let done = 0, corr = 0;
    ps.forEach(p => {
      const block = el(`<section class="card">
        <span class="pill">${esc(p.part)}</span>
        <h3>${esc(p.title)}</h3>
        <div class="passage">${esc(p.text).replace(/\n/g, "<br>")}</div>
        <div class="qhost"></div></section>`);
      wrap.append(block);
      buildQuiz(block.querySelector(".qhost"), p.questions, c => { corr += c; if (++done === ps.length) { results.reading.correct += corr; $("#mrNext", v).hidden = false; } });
    });
    $("#mrNext", v).addEventListener("click", next);
  }

  function secWriting(sec, next) {
    const v = el(`<div class="view">${sectionHead("")}
      <section class="card"><span class="pill">Prompt</span><p class="prompt">${esc(sec.prompt)}</p></section>
      <section class="card">
        <textarea id="wt" class="writebox" placeholder="Write your response here…"></textarea>
        <div class="wcount"><span id="wc">0</span> words · target ${sec.minWords}–${sec.maxWords}</div>
        <h3>Self-check before you submit</h3>
        <div class="checks">${sec.checklist.map((c, i) => `<label class="check"><input type="checkbox" data-i="${i}"> <span>${esc(c)}</span></label>`).join("")}</div>
        <button class="primary" id="wSubmit">Submit &amp; continue →</button>
      </section></div>`);
    app.append(v);
    const ta = $("#wt", v), wc = $("#wc", v);
    const count = () => (ta.value.trim().match(/\S+/g) || []).length;
    ta.addEventListener("input", () => {
      const n = count(); wc.textContent = n;
      wc.parentElement.classList.toggle("ok", n >= sec.minWords && n <= sec.maxWords);
    });
    $("#wSubmit", v).addEventListener("click", () => { results.writing.words = count(); results.writing.done = true; next(); });
  }

  function secSpeaking(sec, next) {
    const tasks = sec.taskIds.map(id => SPEAKING_TASKS.find(t => t.id === id)).filter(Boolean);
    results.speaking.total += tasks.length;
    let ti = 0;
    function oneTask() {
      app.innerHTML = ""; TTS.stop(); window.scrollTo(0, 0);
      if (ti >= tasks.length) return next();
      const task = tasks[ti];
      const prompt = task.prompts[Math.floor(Math.random() * task.prompts.length)];
      const v = el(`<div class="view">${header(mock.title, `Speaking ${ti + 1} of ${tasks.length}`, true)}
        <section class="card"><span class="pill">${esc(task.title)}</span><p class="prompt">${esc(prompt)}</p></section>
        <section class="timer-wrap">
          <div class="timer" id="t">${task.prep}<small>prep</small></div>
          <div class="rec-row"><button class="primary" id="start">Start prep</button>
          <button class="rec" id="rec" disabled>● Record</button></div>
          <audio id="pl" controls hidden></audio>
          <p class="phase" id="ph">${task.prep}s prep, then ${task.response}s to speak.</p>
        </section>
        <button class="ghost" id="skip">Skip / Next task →</button></div>`);
      app.append(v);
      const tEl = $("#t", v), ph = $("#ph", v), start = $("#start", v), rec = $("#rec", v), pl = $("#pl", v);
      let iv, mr, chunks = [], stream;
      const cd = (sec2, lab, done) => { clearInterval(iv); let t = sec2; tEl.innerHTML = `${t}<small>${lab}</small>`; iv = setInterval(() => { t--; tEl.innerHTML = `${Math.max(t, 0)}<small>${lab}</small>`; tEl.classList.toggle("warn", t <= 5); if (t <= 0) { clearInterval(iv); done(); } }, 1000); };
      start.addEventListener("click", () => { start.disabled = true; ph.textContent = "Prep — jot keywords."; cd(task.prep, "prep", () => { ph.textContent = "Go! Tap Record."; rec.disabled = false; tEl.classList.add("ready"); tEl.innerHTML = `${task.response}<small>speak</small>`; navigator.vibrate && navigator.vibrate(120); }); });
      const stop = () => { clearInterval(iv); if (mr && mr.state === "recording") mr.stop(); rec.textContent = "● Record"; rec.classList.remove("live"); rec.disabled = true; ph.textContent = "Recorded. Play it back, then continue."; };
      rec.addEventListener("click", async () => {
        if (mr && mr.state === "recording") return stop();
        try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
        catch (e) { ph.textContent = "⚠️ Mic blocked — allow access in Safari settings."; return; }
        chunks = []; mr = new MediaRecorder(stream);
        mr.ondataavailable = e => e.data.size && chunks.push(e.data);
        mr.onstop = () => { pl.src = URL.createObjectURL(new Blob(chunks, { type: chunks[0]?.type || "audio/webm" })); pl.hidden = false; stream.getTracks().forEach(t => t.stop()); results.speaking.recorded++; };
        mr.start(); rec.textContent = "■ Stop"; rec.classList.add("live"); ph.textContent = "Recording…"; cd(task.response, "speak", stop);
      });
      $("#skip", v).addEventListener("click", () => { TTS.stop(); ti++; oneTask(); });
    }
    oneTask();
  }

  function bandFrom(pct) {
    if (pct >= 90) return 11; if (pct >= 80) return 10; if (pct >= 70) return 9;
    if (pct >= 60) return 8; if (pct >= 50) return 7; if (pct >= 40) return 6; return 5;
  }
  function summary() {
    logActivity("mock"); addPoints("mock", 1);
    const l = results.listening, r = results.reading;
    const lPct = l.total ? Math.round(l.correct / l.total * 100) : 0;
    const rPct = r.total ? Math.round(r.correct / r.total * 100) : 0;
    const objPct = (l.total + r.total) ? Math.round((l.correct + r.correct) / (l.total + r.total) * 100) : 0;
    const band = bandFrom(objPct);
    const hist = store.get("mockHist", []);
    hist.unshift({ day: todayKey(), title: mock.title, lPct, rPct, band });
    store.set("mockHist", hist.slice(0, 30));
    app.innerHTML = "";
    const v = el(`<div class="view">${header("Results", mock.title, true)}
      <section class="hero compact"><div class="hero-target"><span class="t-num">${band}+</span><span class="t-lab">est. band</span></div>
        <div class="hero-stats"><div><b>${lPct}%</b><span>listening</span></div><div><b>${rPct}%</b><span>reading</span></div></div></section>
      <section class="card">
        <h3>Breakdown</h3>
        <div class="hist-row"><span>Listening</span><b>${l.correct}/${l.total}</b><small>${lPct}%</small></div>
        <div class="hist-row"><span>Reading</span><b>${r.correct}/${r.total}</b><small>${rPct}%</small></div>
        <div class="hist-row"><span>Writing</span><b>${results.writing.words} words</b><small>${results.writing.done ? "submitted" : "—"}</small></div>
        <div class="hist-row"><span>Speaking</span><b>${results.speaking.recorded}/${results.speaking.total}</b><small>recorded</small></div>
      </section>
      <section class="card"><p class="note">Listening &amp; Reading are auto-scored to estimate your band. Writing and Speaking are practice — review your recordings against the rubric in the Speaking module, and re-read your email against the self-check. The estimate is a guide, not an official score.</p></section>
      <button class="primary" onclick="location.hash='#/mock'">Back to mock exams</button>
    </div>`);
    app.append(v);
  }

  run();
}

      <div class="chips">${l.phrases.map(p => `<button class="chip" data-say="${esc(p)}">${esc(p)} 🔊</button>`).join("")}</div></section>` : ""}
    <button class="ghost" id="markDone">Mark studied ✓</button>
  </div>`);
  app.append(v);
  v.querySelectorAll("[data-say]").forEach(b => b.addEventListener("click", () => { TTS.stop(); TTS.speak(b.dataset.say, "Woman"); }));
  $("#markDone", v).addEventListener("click", () => { logActivity("lesson"); addPoints("lesson", 1); toast("Nice — studied ✓"); go("#/lessons"); });
}

/* ---------- bottom tab bar ---------- */
function buildTabs() {
  const tabs = [
    ["", "≋", "Home"], ["speaking", "🎙", "Speak"], ["listening", "🎧", "Listen"],
    ["mock", "📝", "Mock"], ["lessons", "🎓", "Lessons"],
  ];
  const bar = el(`<nav class="tabs">${tabs.map(([h, ic, lab]) =>
    `<button data-tab="${h}" onclick="location.hash='#/${h}'"><span>${ic}</span><small>${lab}</small></button>`).join("")}</nav>`);
  document.body.append(bar);
}
const TAB_MATCH = {
  "": [""],
  speaking: ["speaking", "speaking-task"],
  listening: ["listening", "listening-set"],
  mock: ["mock", "mock-run"],
  lessons: ["lessons", "lesson"],
};
function highlightTab(name) {
  document.querySelectorAll(".tabs button").forEach(b => {
    const t = b.dataset.tab;
    b.classList.toggle("on", (TAB_MATCH[t] || [t]).includes(name));
  });
}

/* ---------- toast ---------- */
let toastT;
function toast(msg) {
  let t = $("#toast");
  if (!t) { t = el(`<div id="toast"></div>`); document.body.append(t); }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200);
}

/* ---------- boot ---------- */
TTS.init();
buildTabs();
if (!location.hash) location.hash = "#/";
router();

// register service worker for installable / offline use
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}

  </script>
